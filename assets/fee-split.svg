<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="gL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0d2b26"/>
    </linearGradient>
    <linearGradient id="gR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b0d20"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1000" height="400" fill="#000"/>

  <!-- incoming fee pipe -->
  <rect x="460" y="0" width="80" height="150" fill="#111"/>
  <text x="500" y="30" text-anchor="middle" fill="#888" font-size="12">100% FEE IN</text>
  <circle r="6" fill="#fff">
    <animateMotion path="M500,40 L500,150" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- splitter core -->
  <circle cx="500" cy="190" r="55" fill="#111" stroke="#fff" stroke-width="2"/>
  <text x="500" y="196" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">SPLIT</text>
  <circle cx="500" cy="190" r="66" fill="none" stroke="#fff" stroke-opacity="0.25">
    <animate attributeName="r" values="60;72;60" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0.05;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- left half : holders -->
  <rect x="0" y="150" width="460" height="250" fill="url(#gL)"/>
  <text x="230" y="220" text-anchor="middle" fill="#00ff9d" font-size="46" font-weight="800">50%</text>
  <text x="230" y="250" text-anchor="middle" fill="#cfe" font-size="15">TOKEN HOLDERS</text>
  <text x="230" y="272" text-anchor="middle" fill="#688" font-size="11">pro-rata, streamed on-chain</text>

  <!-- right half : recipient -->
  <rect x="540" y="150" width="460" height="250" fill="url(#gR)"/>
  <text x="770" y="220" text-anchor="middle" fill="#ff5fa2" font-size="46" font-weight="800">50%</text>
  <text x="770" y="250" text-anchor="middle" fill="#fce" font-size="15">FEE RECIPIENT</text>
  <text x="770" y="272" text-anchor="middle" fill="#866" font-size="11">designated at token launch</text>

  <!-- flow lines from splitter -->
  <path d="M470,210 C 380,260 300,280 230,300" stroke="#00ff9d" stroke-width="2" fill="none" stroke-dasharray="5 8">
    <animate attributeName="stroke-dashoffset" from="130" to="0" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <path d="M530,210 C 620,260 700,280 770,300" stroke="#ff5fa2" stroke-width="2" fill="none" stroke-dasharray="5 8">
    <animate attributeName="stroke-dashoffset" from="130" to="0" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#00ff9d"><animateMotion dur="1.4s" repeatCount="indefinite" path="M470,210 C 380,260 300,280 230,300"/></circle>
  <circle r="4" fill="#ff5fa2"><animateMotion dur="1.4s" repeatCount="indefinite" path="M530,210 C 620,260 700,280 770,300"/></circle>

  <!-- divider -->
  <line x1="500" y1="150" x2="500" y2="400" stroke="#333" stroke-width="1.5"/>
</svg>
